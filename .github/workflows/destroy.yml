name: Destroy disposable AWS demo
on:
  workflow_dispatch:
    inputs:
      demo_run_id:
        description: Successful demo workflow run containing deployment-manifest
        required: true
        type: string
permissions:
  id-token: write
  contents: read
  actions: read
concurrency:
  group: appointment-portal-demo
  cancel-in-progress: false
jobs:
  destroy:
    environment: demo
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Restrict the demo environment to its selected branch
        if: github.ref != format('refs/heads/{0}', vars.DEMO_BRANCH)
        run: exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Execute validator and cleanup code only from the trusted dispatch commit.
          ref: ${{ github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: '11.22.0'
          run_install: false
          cache: false
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Restore archived deployment inventory
        env:
          DEMO_RUN_ID: ${{ inputs.demo_run_id }}
          DEMO_BRANCH: ${{ vars.DEMO_BRANCH }}
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: |
          pnpm demo:restore-manifest
      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_DELIVERY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          unset-current-credentials: true
      - name: Destroy application and verify application scope
        run: |
          pnpm demo:destroy -- --dry-run
          pnpm demo:destroy -- --force-disposable-secrets
          pnpm demo:verify-cleanup
      - name: Upload cleanup inventory
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cleanup-inventory
          path: .runtime/pre-destroy-inventory.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
