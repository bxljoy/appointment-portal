name: Disposable AWS demo
on:
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
concurrency:
  group: appointment-portal-demo
  cancel-in-progress: false
jobs:
  deploy-and-verify:
    environment: demo
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      POSTGRES_VERSION: ${{ vars.POSTGRES_VERSION }}
      MAX_COST_USD: ${{ vars.MAX_COST_USD }}
      DEMO_DURATION_HOURS: ${{ vars.DEMO_DURATION_HOURS }}
      DEMO_PATIENT_EMAIL: ${{ secrets.DEMO_PATIENT_EMAIL }}
      DEMO_CLINICIAN_EMAIL: ${{ secrets.DEMO_CLINICIAN_EMAIL }}
      PRICE_REPORT_JSON: ${{ vars.PRICE_REPORT_JSON }}
    steps:
      - name: Restrict the demo environment to its selected branch
        if: github.ref_name != vars.DEMO_BRANCH
        run: exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: '11.22.0'
          run_install: false
          cache: false
      - name: Install and run local quality gates
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm build
          pnpm --filter @portal/api build:lambdas
          pnpm check:infra
          pnpm check:bundles
          pnpm check:artifacts
      - name: Install the deployed-browser test runtime
        run: pnpm exec playwright install --with-deps chromium
      - name: Prepare private runtime inputs
        run: pnpm demo:prepare
      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_DELIVERY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          unset-current-credentials: true
      - name: Preflight and deploy two phases
        run: |
          pnpm demo:preflight
          pnpm demo:deploy
      - name: Capture sanitized failure diagnostics
        if: failure()
        run: pnpm check:artifacts
      - name: Attempt application cleanup after failure
        if: failure()
        continue-on-error: true
        run: pnpm demo:destroy -- --force-disposable-secrets
      - name: Upload credential-free deployment inventory
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deployment-manifest
          path: |
            .runtime/deployment.json
            .runtime/pre-destroy-inventory.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
